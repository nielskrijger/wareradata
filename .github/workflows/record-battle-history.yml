name: record-battle-history
on:
  schedule:
    # 03:00 UTC daily — EU asleep, US winding down. The live API serves a
    # ~2-week rolling window of finished battles, so a daily capture has a wide
    # safety margin against battles aging out before we archive them.
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: record-battle-history
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Record battle history
        run: npm run record-battle-history
        env:
          WARERA_API_KEY: ${{ secrets.WARERA_API_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          WARERA_LOG_REQUESTS: '1'
